name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: radarao, POSTGRES_PASSWORD: radarao, POSTGRES_DB: radarao_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U radarao" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: services } }
    env:
      DATABASE_URL: postgresql+psycopg://radarao:radarao@localhost:5432/radarao_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13", enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typage (mypy strict)
        run: uv run mypy api worker
      - name: Tests
        run: uv run pytest -q
      - name: Migrations à jour avec les modèles
        env: { DATABASE_URL: "postgresql+psycopg://radarao:radarao@localhost:5432/radarao" }
        run: |
          PGPASSWORD=radarao psql -h localhost -U radarao -d radarao_test -c "CREATE DATABASE radarao"
          uv run alembic upgrade head && uv run alembic check
      - name: Évaluations rapides (hors ligne)
        run: uv run python ../evals/run_evals.py --quick
      - uses: actions/upload-artifact@v4
        with: { name: rapport-evals, path: evals/reports/*.md }

  evals-live:
    # Évaluations avec Claude, seulement si le prompt ou le pipeline change ET si la clé est configurée.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: python
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: radarao, POSTGRES_PASSWORD: radarao, POSTGRES_DB: radarao_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U radarao" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://radarao:radarao@localhost:5432/radarao_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(services/worker/|docs/prompts/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        with: { python-version: "3.13", enable-cache: true }
      - if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        working-directory: services
        run: uv sync --frozen && uv run python ../evals/run_evals.py --live --quick

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx eslint src
      - run: npm run typecheck
      - run: npm run build

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
      - run: make k8s-validate

  images:
    runs-on: ubuntu-latest
    needs: [python, web]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/radarao-services:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/radarao-services:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/radarao-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/radarao-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
