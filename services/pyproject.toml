[project]
name = "radarao-services"
version = "0.1.0"
description = "RadarAO — API (FastAPI) et worker (Celery)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "anthropic>=0.70",
  "voyageai>=0.3",
  "pymupdf>=1.24",
  "boto3>=1.34",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "itsdangerous>=2.2",
  "orjson>=3.10",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-python-dateutil", "boto3-stubs[s3]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
