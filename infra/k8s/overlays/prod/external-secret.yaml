# Nécessite l'opérateur External Secrets et un ClusterSecretStore « radarao-store »
# (ex. AWS Secrets Manager ca-central-1). Aucune valeur secrète n'est versionnée.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: radarao-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: radarao-store }
  target: { name: radarao-secrets, creationPolicy: Owner }
  dataFrom: [{ extract: { key: radarao/production } }]
