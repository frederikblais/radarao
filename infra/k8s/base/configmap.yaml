# Configuration non secrète. Les secrets (radarao-secrets) sont créés hors du dépôt :
#   DATABASE_URL, REDIS_URL, SECRET_KEY, S3_ACCESS_KEY, S3_SECRET_KEY, ANTHROPIC_API_KEY,
#   VOYAGE_API_KEY, DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_WAREHOUSE_ID, SMTP_USER, SMTP_PASSWORD,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   (voir infra/k8s/README.md)
apiVersion: v1
kind: ConfigMap
metadata:
  name: radarao-config
data:
  ENV: production
  AI_MODE: live
  TASK_MODE: celery
  STORAGE_BACKEND: s3
  S3_BUCKET: radarao-documents
  S3_REGION: ca-central-1
  EMAIL_BACKEND: smtp
  WEB_BASE_URL: https://radarao.example.ca
  API_BASE_URL: https://radarao.example.ca/api
  CORS_ORIGINS: '["https://radarao.example.ca"]'
  RETENTION_DAYS: "90"
  BUDGET_PER_DOSSIER_USD: "5"
  BUDGET_MONTHLY_COMPANY_USD: "50"
  DATABRICKS_CATALOG: workspace
  DATABRICKS_SCHEMA: radarao
