# Migration Alembic exécutée avant chaque déploiement (Argo CD : hook PreSync; sinon kubectl apply puis wait).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate, radarao/db-client: "true" }
    spec:
      serviceAccountName: radarao
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      restartPolicy: Never
      containers:
        - name: migrate
          image: radarao-services
          args: ["alembic", "upgrade", "head"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
          envFrom:
            - configMapRef: { name: radarao-config }
            - secretRef: { name: radarao-secrets }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
