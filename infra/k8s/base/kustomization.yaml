apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radarao
labels:
  - pairs: { app.kubernetes.io/part-of: radarao }
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api.yaml
  - web.yaml
  - workers.yaml
  - migrate-job.yaml
  - cronjobs.yaml
  - ingress.yaml
  - networkpolicies.yaml
images:
  - name: radarao-services
    newName: ghcr.io/frederikblais/radarao-services
    newTag: latest
  - name: radarao-web
    newName: ghcr.io/frederikblais/radarao-web
    newTag: latest
