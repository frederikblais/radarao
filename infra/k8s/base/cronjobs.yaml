apiVersion: batch/v1
kind: CronJob
metadata: { name: seao-ingest }
spec:
  schedule: "17 7 * * 1,2"
  timeZone: America/Toronto
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: seao-ingest, app.kubernetes.io/component: cron, radarao/db-client: "true", radarao/egress-ai: "true" }
        spec:
          serviceAccountName: radarao
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          restartPolicy: OnFailure
          containers:
            - name: task
              image: radarao-services
              args: ["python", "-m", "worker.run_task", "ingest_latest"]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
              envFrom:
                - configMapRef: { name: radarao-config }
                - secretRef: { name: radarao-secrets }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
              resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 4Gi } }]
---
