# Développement local : make dev  (docker compose -f infra/docker-compose.yml up --build)
name: radarao

x-services-env: &services-env
  ENV: dev
  DATABASE_URL: postgresql+psycopg://radarao:radarao@postgres:5432/radarao
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: radarao-documents
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  STORAGE_BACKEND: s3
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  WEB_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:3000/api
  TASK_MODE: celery
  # Clés (facultatives) lues depuis ../.env : ANTHROPIC_API_KEY, VOYAGE_API_KEY, DATABRICKS_*
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  AI_MODE: ${AI_MODE:-live}
  DATABRICKS_HOST: ${DATABRICKS_HOST:-}
  DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
  DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}

x-services: &services
  build: { context: .., dockerfile: services/Dockerfile }
  image: radarao-services:dev
  environment: *services-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: radarao, POSTGRES_PASSWORD: radarao, POSTGRES_DB: radarao }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U radarao"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/radarao-documents"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]  # interface web des courriels (liens magiques)

  migrate:
    build: { context: .., dockerfile: services/Dockerfile }
    image: radarao-services:dev
    environment: *services-env
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *services
    ports: ["8000:8000"]
    command: ["uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes: ["../services:/app/services:ro", "../docs/prompts:/app/docs/prompts:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    <<: *services
    command: ["celery", "-A", "worker.celery_app", "worker", "-Q", "default,analysis", "--concurrency", "4", "--loglevel", "INFO"]

  beat:
    <<: *services
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel", "INFO"]

  web:
    build: { context: ../apps/web }
    environment: { API_INTERNAL_URL: http://api:8000 }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata: {}
  miniodata: {}
